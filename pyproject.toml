[project]
name = "nlp-final"
version = "0.1.0"
description = ""
requires-python = ">=3.12"

dependencies = [
    "vllm>=0.22.0",
    "ninja",
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "hf-transfer>=0.1.8",
    "numpy",
    "pandas",
    "tqdm",
    "accelerate>=1.13.0",
    "peft>=0.19.1",
]

[dependency-groups]
dev = [
    "ruff",
    "ipython",
    "jupyter",
    "ipykernel<7",
    "ipywidgets",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generation"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
